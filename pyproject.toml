[project]
name = "python-infisical"
version = "0.1.0"
description = "Lightweight Python client for Infisical secrets manager"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "infisicalsdk>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_infisical"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
